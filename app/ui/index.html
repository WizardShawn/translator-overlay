<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Translator Overlay</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="10" height="8" rx="1.5" style="fill:none;stroke:var(--muted)" stroke-width="1.3"/><rect x="5" y="6" width="10" height="8" rx="1.5" style="fill:var(--sub)"/></svg>
      Translator Overlay
    </div>
    <a href="#games" data-page="games"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="4" width="13" height="8" rx="3"/><path d="M5 6.5v3M3.5 8h3"/></svg>Games</a>
    <a href="#profile" data-page="profile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2.5h7.5a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2z"/><path d="M3 11.5a2 2 0 0 1 2-2h7.5"/></svg>Game profile</a>
    <a href="#session" data-page="session"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h12M2 8h9M2 12h11"/></svg>Live session</a>
    <a href="#settings" data-page="settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4h7M12 4h2M2 12h2M7 12h7"/><circle cx="10.5" cy="4" r="1.5"/><circle cx="5.5" cy="12" r="1.5"/></svg>Settings</a>
    <div class="spacer"></div>
    <div class="runstate" id="runstate"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="ui.js"></script>
</body>
</html>
